<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miss Poppy Rabbit</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --poppy: #E63946;
    --poppy-dim: #8a222a;
    --stem: #6A994E;
    --gray: #888;
    --darkgray: #2a2a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Courier New", monospace;
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 0 16px; border-bottom: 2px solid var(--darkgray); }
  header h1 { font-size: 22px; letter-spacing: 2px; }
  header .sub { color: var(--gray); font-size: 12px; }
  #wsdot { width: 10px; height: 10px; border-radius: 50%; background: var(--gray); margin-left: auto; }
  #wsdot.on { background: var(--stem); }
  canvas { image-rendering: pixelated; }

  .card { border: 1px solid var(--darkgray); border-radius: 8px; padding: 16px; margin-top: 16px; }
  .card h2 { font-size: 14px; color: var(--poppy); letter-spacing: 1px; margin-bottom: 12px; }

  /* Pomodoro */
  #pomo { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  #pomo-time { font-size: 42px; font-weight: bold; }
  #pomo-phase { font-size: 13px; letter-spacing: 2px; }
  #pomo-phase.work { color: var(--poppy); }
  #pomo-phase.break { color: var(--stem); }
  #pomo-today { color: var(--stem); font-size: 12px; margin-top: 4px; }
  #pomo-bar { height: 8px; background: var(--darkgray); border-radius: 4px; overflow: hidden; flex-basis: 100%; }
  #pomo-fill { height: 100%; background: var(--poppy); width: 0%; transition: width .5s linear; }
  button {
    background: var(--bg); color: var(--fg); border: 1px solid var(--poppy);
    border-radius: 6px; padding: 8px 14px; font-family: inherit; cursor: pointer;
  }
  button:hover { background: var(--poppy-dim); }

  /* Tareas */
  #newtask { display: flex; gap: 8px; margin-bottom: 12px; }
  #newtask input {
    flex: 1; background: var(--bg); color: var(--fg);
    border: 1px solid var(--darkgray); border-radius: 6px; padding: 8px; font-family: inherit;
  }
  #newtask input:focus { outline: none; border-color: var(--poppy); }
  ul { list-style: none; }
  li { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--darkgray); }
  li .box { width: 16px; height: 16px; border: 1px solid var(--fg); border-radius: 3px; cursor: pointer; flex: none; }
  li.done .box { background: var(--stem); border-color: var(--stem); }
  li.done .title { color: var(--gray); text-decoration: line-through; }
  li .title { flex: 1; }
  li .prio { font-size: 10px; padding: 2px 8px; border-radius: 8px; cursor: pointer; border: 1px solid var(--gray); color: var(--gray); }
  li .prio.p2 { border-color: var(--poppy); color: var(--poppy); }
  li .prio.p1 { border-color: var(--fg); color: var(--fg); }
  li .del { color: var(--gray); cursor: pointer; padding: 0 6px; }
  li .del:hover { color: var(--poppy); }
  #empty { color: var(--gray); font-size: 13px; padding: 8px 0; }

  footer { color: var(--gray); font-size: 11px; margin-top: 16px; display: flex; gap: 16px; flex-wrap: wrap; }

  /* Agenda */
  #cal-legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .cal-chip { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--gray);
              border: 1px solid var(--darkgray); border-radius: 10px; padding: 3px 10px; cursor: pointer; }
  .cal-chip .dot { width: 10px; height: 10px; border-radius: 3px; }
  #week-strip { display: flex; gap: 4px; margin-bottom: 10px; }
  .wday { flex: 1; text-align: center; padding: 6px 2px; border: 1px solid var(--darkgray);
          border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--gray); }
  .wday.sel { border-color: var(--poppy); color: var(--fg); }
  .wday.today { color: var(--poppy); }
  .wday .dots { display: flex; gap: 2px; justify-content: center; margin-top: 3px; min-height: 4px; }
  .wday .dots i { width: 4px; height: 4px; border-radius: 50%; display: block; }
  #events li { gap: 8px; }
  #events .bar { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
  #events .time { color: var(--gray); font-size: 12px; white-space: nowrap; }
  #ev-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  #ev-form input, #ev-form select {
    background: var(--bg); color: var(--fg); border: 1px solid var(--darkgray);
    border-radius: 6px; padding: 7px; font-family: inherit;
  }
  #ev-form input:focus, #ev-form select:focus { outline: none; border-color: var(--poppy); }
  #ev-form .full { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <canvas id="rabbit" width="16" height="16" style="width:48px;height:48px"></canvas>
  <div>
    <h1>Miss Poppy Rabbit</h1>
    <div class="sub" id="devname">connecting...</div>
  </div>
  <div id="wsdot" title="WebSocket"></div>
</header>

<div class="card">
  <h2>POMODORO</h2>
  <div id="pomo">
    <div>
      <div id="pomo-time">--:--</div>
      <div id="pomo-phase" class="work">TRABAJO</div>
      <div id="pomo-today"></div>
    </div>
    <button id="pomo-btn" onclick="post('/api/pomodoro/action')">Start</button>
    <button id="pomo-reset" onclick="post('/api/pomodoro/reset')">Reset</button>
    <div id="pomo-bar"><div id="pomo-fill"></div></div>
  </div>
</div>

<div class="card">
  <h2>AGENDA</h2>
  <div id="cal-legend"></div>
  <div id="week-strip"></div>
  <ul id="events"></ul>
  <div id="ev-empty" hidden>No events.</div>
  <button id="ev-add" style="margin-top:10px" onclick="openForm()">+ Event</button>
  <form id="ev-form" hidden onsubmit="return saveEvent()">
    <input class="full" id="ev-title" maxlength="47" placeholder="Title..." required>
    <input id="ev-date" type="date" required>
    <input id="ev-time" type="time" required>
    <select id="ev-dur">
      <option value="30">30 min</option>
      <option value="60" selected>60 min</option>
      <option value="90">90 min</option>
      <option value="120">120 min</option>
    </select>
    <select id="ev-cal"></select>
    <input type="hidden" id="ev-id" value="0">
    <button type="submit" id="ev-save">Save</button>
    <button type="button" id="ev-cancel" onclick="closeForm()">Cancel</button>
  </form>
</div>

<div class="card">
  <h2 id="h-tasks">TASKS</h2>
  <form id="newtask" onsubmit="return addTask()">
    <input id="title" maxlength="47" placeholder="New task..." autocomplete="off">
    <button type="submit" id="btn-create">Add</button>
  </form>
  <ul id="tasks"></ul>
  <div id="empty" hidden>No tasks. The rabbit is proud of you.</div>
</div>

<footer>
  <span id="st-batt"></span>
  <span id="st-heap"></span>
  <span id="st-up"></span>
  <span id="st-ver"></span>
</footer>

<script>
// El mismo conejo que el firmware, mismo formato de mapa de caracteres
const RABBIT = [
  "   ##    ##     ",
  "  ####  ####    ",
  "  ####  ####    ",
  "  ####  ####    ",
  "  ####  #### RR ",
  "  ##########RRRR",
  " ###########RRRR",
  " ##  ######  RR ",
  " ##  ######  G  ",
  " ############G  ",
  " ######RR#####  ",
  "  #####RR####   ",
  "  ###########   ",
  "   #########    ",
  "    #######     ",
  "                ",
];
const COLORS = { "#": "#fff", "R": "#E63946", "r": "#8a222a", "G": "#6A994E" };
(function drawRabbit() {
  const ctx = document.getElementById("rabbit").getContext("2d");
  RABBIT.forEach((row, y) => [...row].forEach((ch, x) => {
    if (COLORS[ch]) { ctx.fillStyle = COLORS[ch]; ctx.fillRect(x, y, 1, 1); }
  }));
})();

const $ = (id) => document.getElementById(id);

// i18n: el idioma lo manda el dispositivo en /api/status ("lang") — una sola
// fuente de verdad. La web solo pinta lo que el firmware diga.
const I18N = {
  en: { tasks: "TASKS", reset: "Reset", create: "Add", placeholder: "New task...",
        empty: "No tasks. The rabbit is proud of you.", confirmDel: "Delete task?",
        work: "WORK", brk: "BREAK", today: "Today", prio: ["low", "med", "high"],
        btn: { ready: "Start", running: "Pause", paused: "Resume", finished: "Next" },
        batt: "battery", ram: "free RAM", up: "uptime",
        evAdd: "+ Event", evEmpty: "No events this day.", evSave: "Save", evCancel: "Cancel",
        evTitle: "Title...", evConfirmDel: "Delete event?", renamePrompt: "Calendar name:" },
  es: { tasks: "TAREAS", reset: "Reiniciar", create: "Crear", placeholder: "Nueva tarea...",
        empty: "Sin tareas. El conejo esta orgulloso de ti.", confirmDel: "Borrar tarea?",
        work: "TRABAJO", brk: "DESCANSO", today: "Hoy", prio: ["baja", "media", "alta"],
        btn: { ready: "Iniciar", running: "Pausar", paused: "Seguir", finished: "Siguiente" },
        batt: "bateria", ram: "RAM libre", up: "uptime",
        evAdd: "+ Evento", evEmpty: "Sin eventos este dia.", evSave: "Guardar", evCancel: "Cancelar",
        evTitle: "Titulo...", evConfirmDel: "Borrar evento?", renamePrompt: "Nombre del calendario:" },
};
let LANG = "en";
const T = () => I18N[LANG];
let lastTasks = [], lastPomo = null;

function applyLang() {
  document.documentElement.lang = LANG;
  $("h-tasks").textContent = T().tasks;
  $("pomo-reset").textContent = T().reset;
  $("btn-create").textContent = T().create;
  $("title").placeholder = T().placeholder;
  $("ev-add").textContent = T().evAdd;
  $("ev-save").textContent = T().evSave;
  $("ev-cancel").textContent = T().evCancel;
  $("ev-title").placeholder = T().evTitle;
  renderTasks(lastTasks);
  if (lastPomo) renderPomo(lastPomo);
  renderAgenda();
}

async function post(url) { await fetch(url, { method: "POST" }); }

function addTask() {
  const title = $("title").value.trim();
  if (title) {
    fetch("/api/tasks?title=" + encodeURIComponent(title), { method: "POST" });
    $("title").value = "";
  }
  return false;   // no recargar la página
}

function renderTasks(tasks) {
  lastTasks = tasks;
  const ul = $("tasks");
  ul.innerHTML = "";
  const sorted = [...tasks.filter(t => !t.done), ...tasks.filter(t => t.done)];
  for (const t of sorted) {
    const li = document.createElement("li");
    li.className = t.done ? "done" : "";
    li.innerHTML =
      `<div class="box" onclick="post('/api/tasks/toggle?id=${t.id}')"></div>` +
      `<span class="title"></span>` +
      `<span class="prio p${t.prio}" onclick="post('/api/tasks/priority?id=${t.id}')">${T().prio[t.prio]}</span>` +
      `<span class="del" onclick="if(confirm('${T().confirmDel}'))post('/api/tasks/delete?id=${t.id}')">&times;</span>`;
    li.querySelector(".title").textContent = t.title;   // seguro ante HTML en títulos
    ul.appendChild(li);
  }
  $("empty").textContent = T().empty;
  $("empty").hidden = sorted.length > 0;
}

function renderPomo(p) {
  lastPomo = p;
  const m = String(Math.floor(p.remainingSec / 60)).padStart(2, "0");
  const s = String(p.remainingSec % 60).padStart(2, "0");
  $("pomo-time").textContent = `${m}:${s}`;
  const work = p.phase === "work";
  $("pomo-phase").textContent = work ? T().work : T().brk;
  $("pomo-phase").className = work ? "work" : "break";
  $("pomo-fill").style.width = (100 * p.remainingSec / p.totalSec) + "%";
  $("pomo-fill").style.background = work ? "var(--poppy)" : "var(--stem)";
  $("pomo-today").textContent = `${T().today}: ${p.today} pomodoros`;
  $("pomo-btn").textContent = T().btn[p.run];
}

// ---------------- Agenda ----------------
const CAL_HEX = ["#E63946", "#6A994E", "#E9C46A", "#5FA8D3"];
let agenda = { calendars: [], events: [] };
let selDay = midnight(new Date());

function midnight(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
const DAY_MS = 86400000;

function renderAgenda() {
  // Leyenda de calendarios (clic para renombrar)
  $("cal-legend").innerHTML = "";
  for (const c of agenda.calendars) {
    const chip = document.createElement("div");
    chip.className = "cal-chip";
    chip.innerHTML = `<span class="dot" style="background:${CAL_HEX[c.id % 4]}"></span>`;
    chip.append(c.name);
    chip.onclick = () => {
      const name = prompt(T().renamePrompt, c.name);
      if (name) post(`/api/calendars/rename?id=${c.id}&name=${encodeURIComponent(name)}`);
    };
    $("cal-legend").appendChild(chip);
  }

  // Tira de la semana (lunes a domingo de la semana del día elegido)
  const monday = new Date(selDay.getTime() - ((selDay.getDay() + 6) % 7) * DAY_MS);
  const today = midnight(new Date());
  $("week-strip").innerHTML = "";
  const DL = { en: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
               es: ["Lun","Mar","Mie","Jue","Vie","Sab","Dom"] }[LANG];
  for (let i = 0; i < 7; i++) {
    const day = new Date(monday.getTime() + i * DAY_MS);
    const btn = document.createElement("div");
    btn.className = "wday" + (day.getTime() === selDay.getTime() ? " sel" : "")
                           + (day.getTime() === today.getTime() ? " today" : "");
    const dayEvs = eventsOf(day);
    btn.innerHTML = `${DL[i]} ${day.getDate()}<div class="dots">` +
      dayEvs.slice(0, 4).map(e => `<i style="background:${CAL_HEX[e.cal % 4]}"></i>`).join("") +
      `</div>`;
    btn.onclick = () => { selDay = day; renderAgenda(); };
    $("week-strip").appendChild(btn);
  }

  // Lista del día
  const ul = $("events");
  ul.innerHTML = "";
  const evs = eventsOf(selDay).sort((a, b) => a.start - b.start);
  for (const e of evs) {
    const li = document.createElement("li");
    const t0 = new Date(e.start * 1000), t1 = new Date(e.end * 1000);
    const hm = (d) => d.toTimeString().slice(0, 5);
    li.innerHTML =
      `<span class="bar" style="background:${CAL_HEX[e.cal % 4]}"></span>` +
      `<span class="time">${hm(t0)}-${hm(t1)}</span>` +
      `<span class="title"></span>` +
      `<span class="del" onclick="editEvent(${e.id})" title="edit">&#9998;</span>` +
      `<span class="del" onclick="if(confirm('${T().evConfirmDel}'))post('/api/events/delete?id=${e.id}')">&times;</span>`;
    li.querySelector(".title").textContent = e.title;
    ul.appendChild(li);
  }
  $("ev-empty").textContent = T().evEmpty;
  $("ev-empty").hidden = evs.length > 0;
}

function eventsOf(day) {
  const a = day.getTime() / 1000, b = a + 86400;
  return agenda.events.filter(e => e.start >= a && e.start < b);
}

function openForm(ev) {
  $("ev-form").hidden = false;
  $("ev-add").hidden = true;
  $("ev-id").value = ev ? ev.id : 0;
  $("ev-title").value = ev ? ev.title : "";
  const start = ev ? new Date(ev.start * 1000) : new Date(selDay.getTime() + 9 * 3600000);
  $("ev-date").value = start.toISOString() && new Date(start.getTime() - start.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  $("ev-time").value = start.toTimeString().slice(0, 5);
  $("ev-dur").value = ev ? String(Math.round((ev.end - ev.start) / 60)) : "60";
  const sel = $("ev-cal");
  sel.innerHTML = agenda.calendars.map(c => `<option value="${c.id}"></option>`).join("");
  agenda.calendars.forEach((c, i) => sel.options[i].textContent = c.name);
  sel.value = ev ? String(ev.cal) : "0";
  $("ev-title").focus();
}
function closeForm() { $("ev-form").hidden = true; $("ev-add").hidden = false; }
function editEvent(id) {
  const ev = agenda.events.find(e => e.id === id);
  if (ev) openForm(ev);
}
function saveEvent() {
  const start = new Date(`${$("ev-date").value}T${$("ev-time").value}`).getTime() / 1000;
  const end = start + parseInt($("ev-dur").value, 10) * 60;
  const q = `title=${encodeURIComponent($("ev-title").value.trim())}` +
            `&start=${start}&end=${end}&cal=${$("ev-cal").value}` +
            ($("ev-id").value !== "0" ? `&id=${$("ev-id").value}` : "");
  fetch("/api/events?" + q, { method: "POST" });
  selDay = midnight(new Date(start * 1000));
  closeForm();
  return false;
}

async function refreshStatus() {
  try {
    const s = await (await fetch("/api/status")).json();
    if (s.lang && s.lang !== LANG) {   // el dispositivo cambió de idioma
      LANG = s.lang;
      applyLang();
    }
    $("devname").textContent = `${s.ssid} - ${s.ip}`;
    $("st-batt").textContent = `${T().batt} ${s.battery}%`;
    $("st-heap").textContent = `${T().ram} ${(s.heap / 1024) | 0} KB`;
    $("st-up").textContent = `${T().up} ${(s.uptimeMin / 60) | 0}h ${s.uptimeMin % 60}m`;
    $("st-ver").textContent = `v${s.version}`;
  } catch (e) { /* dispositivo dormido o fuera de red */ }
}

// WebSocket con reconexión; si no hay WS, la página igual carga por REST
let ws;
function connectWS() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => $("wsdot").classList.add("on");
  ws.onclose = () => { $("wsdot").classList.remove("on"); setTimeout(connectWS, 3000); };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "tasks") renderTasks(msg.tasks);
    if (msg.type === "pomo") renderPomo(msg.pomo);
    if (msg.type === "agenda") { agenda = msg.agenda; renderAgenda(); }
  };
}

(async function init() {
  renderTasks(await (await fetch("/api/tasks")).json());
  renderPomo(await (await fetch("/api/pomodoro")).json());
  agenda = await (await fetch("/api/events")).json();
  applyLang();          // pinta agenda + textos con el idioma por defecto
  refreshStatus();
  setInterval(refreshStatus, 10000);
  connectWS();
})();
</script>
</body>
</html>
