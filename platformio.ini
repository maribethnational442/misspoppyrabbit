; Miss Poppy Rabbit — firmware para M5Stack Cardputer ADV (ESP32-S3, 8MB flash, sin PSRAM)
[env:cardputer-adv]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; El Stamp-S3A tiene 8MB de flash; la partición default_8MB deja ~3.3MB para
; la app y ~1.5MB para SPIFFS (que usaremos en v0.3 para la WebUI).
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

; La WebUI se embebe DENTRO del firmware (web/index.html → gzip → header C):
; un solo binario para todos los canales de distribución, sin uploadfs.
extra_scripts = pre:tools/gen_webui.py

build_flags =
    ; Serial por el USB nativo del S3: logs sin adaptador UART externo
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    ; Lib oficial del Cardputer: detecta el modelo ADV (teclado TCA8418 por
    ; I2C) y arrastra M5Unified + M5GFX como dependencias.
    m5stack/M5Cardputer @ ^1.1.0
    bblanchon/ArduinoJson @ ^7.0.0
    ; Servidor web asíncrono (v0.3+): forks mantenidos por la org ESP32Async
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.2

monitor_speed = 115200
